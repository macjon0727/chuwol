<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUWOL Running Mode - With Stop Btn</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        body {
            margin: 0; padding: 0; background-color: #000000; color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 393px; height: 852px;
            /* 역동적인 깊이감을 주는 레이더/그리드 배경 */
            background: 
                linear-gradient(180deg, rgba(10,10,10,0.9) 0%, rgba(0,0,0,1) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(204, 255, 0, 0.05) 40px, rgba(204, 255, 0, 0.05) 41px),
                repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(204, 255, 0, 0.05) 40px, rgba(204, 255, 0, 0.05) 41px);
            position: relative; display: flex; flex-direction: column; box-sizing: border-box;
        }

        /* 상단 상태바 (GPS & 라이브 표시) */
        .top-status {
            display: flex; justify-content: space-between; align-items: center;
            padding: 60px 24px 20px 24px;
        }
        .gps-status { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #CCFF00; }
        .live-dot { width: 8px; height: 8px; background-color: #FF4444; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* 핵심 기능 1: 실시간 추월 레이더 */
        .radar-section {
            background: rgba(26, 26, 26, 0.8); backdrop-filter: blur(10px);
            border: 1px solid rgba(204, 255, 0, 0.3); border-radius: 20px; padding: 20px; margin: 0 24px 30px 24px;
            box-shadow: 0 0 20px rgba(204, 255, 0, 0.1);
        }
        .radar-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
        .target-name { font-size: 15px; font-weight: 700; color: #fff; }
        .target-distance { font-size: 20px; font-weight: 900; font-style: italic; color: #CCFF00; }
        .target-distance span { font-size: 12px; font-weight: 600; color: #888; font-style: normal; }

        /* 레이더 게이지 바 */
        .radar-track { height: 6px; background-color: #333; border-radius: 3px; position: relative; }
        .radar-fill { position: absolute; top: 0; right: 0; width: 25%; height: 100%; background-color: #FF4444; border-radius: 3px; }
        .my-dot { position: absolute; top: -7px; right: 25%; font-size: 18px; filter: drop-shadow(0 0 5px #CCFF00); }
        .target-dot { position: absolute; top: -7px; right: 0; font-size: 18px; opacity: 0.5; }

        /* 핵심 기능 2: 메인 측정 데이터 */
        .metrics-section { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .metric-primary { margin-bottom: 40px; }
        .dist-value { font-size: 110px; font-weight: 900; font-style: italic; color: #ffffff; line-height: 1; letter-spacing: -4px; text-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .dist-label { font-size: 18px; font-weight: 700; color: #CCFF00; margin-top: 5px; text-transform: uppercase; letter-spacing: 2px;}
        .metric-secondary { display: flex; width: 100%; padding: 0 40px; justify-content: space-between; box-sizing: border-box; }
        .sub-metric { display: flex; flex-direction: column; align-items: center; }
        .sub-value { font-size: 36px; font-weight: 900; font-style: italic; color: #ffffff; margin-bottom: 5px; }
        .sub-label { font-size: 13px; font-weight: 600; color: #888888; text-transform: uppercase; letter-spacing: 1px;}

        /* 컨트롤 버튼 영역 */
        .controls-section {
            padding: 0 24px 60px 24px; display: flex; justify-content: center; align-items: center; gap: 20px;
        }
        
        /* 화면 잠금 버튼 */
        .btn-lock {
            width: 60px; height: 60px; border-radius: 50%; background-color: #1A1A1A; border: 1px solid #333;
            display: flex; justify-content: center; align-items: center; font-size: 20px; color: #888; cursor: pointer;
        }

        /* 메인 일시정지 버튼 */
        .btn-pause {
            width: 100px; height: 100px; border-radius: 50%; background-color: #CCFF00;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 0 30px rgba(204, 255, 0, 0.4); border: none;
        }
        .pause-icon { width: 24px; height: 32px; display: flex; justify-content: space-between; }
        .pause-bar { width: 8px; height: 100%; background-color: #000000; border-radius: 4px; }

        /* [수정 포인트] 종료(Stop) 버튼 추가 (경고색) */
        .btn-stop {
            width: 60px; height: 60px; border-radius: 50%; background-color: rgba(255, 68, 68, 0.1); border: 1px solid #FF4444;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.2); transition: 0.2s;
        }
        .stop-icon {
            width: 20px; height: 20px; background-color: #FF4444; border-radius: 4px;
        }
        
        /* 버튼 하단 텍스트 라벨 (선택 사항) */
        .control-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px;}
        .control-label { font-size: 12px; font-weight: 600; color: #888; }
    </style>
</head>
<body>
    <div class="app-container">
        
        <div class="top-status">
            <div class="gps-status">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CCFF00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                GPS HIGH
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
                <div class="live-dot"></div>
                <span style="font-size: 13px; font-weight: 700; color: #fff;">LIVE</span>
            </div>
        </div>

        <div class="radar-section">
            <div class="radar-header">
                <div class="target-name">🔥 타겟: 민수</div>
                <div class="target-distance">0.4 <span>km 남음!</span></div>
            </div>
            <div class="radar-track">
                <div class="radar-fill"></div>
                <div class="my-dot">🏃‍♂️</div>
                <div class="target-dot">🚶‍♂️</div>
            </div>
        </div>

        <div class="metrics-section">
            <div class="metric-primary">
                <div class="dist-value">3.24</div>
                <div class="dist-label">Kilometers</div>
            </div>
            <div class="metric-secondary">
                <div class="sub-metric">
                    <div class="sub-value">5'30"</div>
                    <div class="sub-label">Avg Pace</div>
                </div>
                <div class="sub-metric">
                    <div class="sub-value">17:42</div>
                    <div class="sub-label">Time</div>
                </div>
            </div>
        </div>

        <div class="controls-section">
            <div class="control-wrapper">
                <div class="btn-lock">🔒</div>
                <span class="control-label">잠금</span>
            </div>
            
            <div class="control-wrapper" style="margin: 0 10px;">
                <div class="btn-pause">
                    <div class="pause-icon">
                        <div class="pause-bar"></div>
                        <div class="pause-bar"></div>
                    </div>
                </div>
            </div>
            
            <div class="control-wrapper">
                <div class="btn-stop">
                    <div class="stop-icon"></div>
                </div>
                <span class="control-label" style="color: #FF4444;">종료</span>
            </div>
        </div>

    </div>
</body>
</html>
