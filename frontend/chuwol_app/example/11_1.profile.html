<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUWOL Profile & Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        body {
            margin: 0; padding: 0; background-color: #000000; color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 393px; height: 852px;
            background: linear-gradient(180deg, #0A0A0A 0%, #111111 100%);
            position: relative; display: flex; flex-direction: column; box-sizing: border-box;
        }

        /* 미세한 왼쪽 사선 패턴 */
        .bg-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.15;
            background-image: repeating-linear-gradient(-45deg, #444444, #444444 1px, transparent 1px, transparent 8px);
            pointer-events: none;
        }

        /* 상단 헤더 */
        .header {
            padding: 60px 24px 20px 24px; position: relative; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-title { font-size: 20px; font-weight: 900; font-style: italic; letter-spacing: 1px; color: #fff; }
        .icon-btn { font-size: 24px; color: #fff; cursor: pointer; }

        /* 메인 컨텐츠 영역 (스크롤 가능) */
        .scroll-section {
            flex-grow: 1; overflow-y: auto; padding: 0 24px 100px 24px; position: relative; z-index: 10;
            display: flex; flex-direction: column; gap: 30px;
        }

        /* 1. 내 프로필 카드 */
        .profile-card {
            background-color: #1A1A1A; border: 1px solid #333; border-radius: 20px; padding: 24px;
            display: flex; flex-direction: column; align-items: center; text-align: center; position: relative;
        }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%; background-color: #222; border: 3px solid #CCFF00;
            display: flex; justify-content: center; align-items: center; font-size: 40px; margin-bottom: 12px;
            box-shadow: 0 0 20px rgba(204, 255, 0, 0.2);
        }
        .nickname { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .tier-badge {
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%); color: #000;
            padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 900; margin-bottom: 15px;
        }
        /* 포인트 표시 */
        .point-box {
            background-color: #000; border: 1px solid #333; border-radius: 12px; padding: 10px 20px;
            display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #888;
        }
        .point-val { font-size: 18px; font-weight: 900; color: #CCFF00; font-style: italic; }

        /* 섹션 공통 타이틀 */
        .section-title { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        /* 2. 아이템 상점 (스트릭 방어권) */
        .shop-section { display: flex; flex-direction: column; }
        .item-card {
            background: linear-gradient(135deg, rgba(30,30,30,1) 0%, rgba(20,20,20,1) 100%);
            border: 1px solid rgba(204, 255, 0, 0.4); border-radius: 16px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 5px 15px rgba(204, 255, 0, 0.05);
        }
        .item-info { display: flex; align-items: center; gap: 15px; }
        .item-icon { font-size: 36px; filter: drop-shadow(0 0 5px rgba(100,200,255,0.5)); }
        .item-text { display: flex; flex-direction: column; gap: 4px; }
        .item-name { font-size: 15px; font-weight: 800; color: #fff; }
        .item-desc { font-size: 11px; font-weight: 600; color: #888; line-height: 1.3; }
        
        .btn-buy {
            background-color: rgba(204, 255, 0, 0.1); border: 1px solid #CCFF00; border-radius: 12px;
            padding: 10px 15px; display: flex; flex-direction: column; align-items: center; gap: 2px;
            cursor: pointer; transition: 0.2s;
        }
        .btn-buy:active { background-color: #CCFF00; }
        .btn-buy:active .buy-txt, .btn-buy:active .buy-price { color: #000; }
        .buy-txt { font-size: 11px; font-weight: 800; color: #CCFF00; }
        .buy-price { font-size: 14px; font-weight: 900; color: #fff; font-style: italic; }

        /* 3. 획득한 배지 (업적) */
        .badges-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        .badge-item {
            background-color: #1A1A1A; border: 1px solid #333; border-radius: 16px; padding: 15px 5px;
            display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
        }
        .badge-icon { font-size: 32px; }
        .badge-icon.locked { filter: grayscale(100%) opacity(0.3); }
        .badge-name { font-size: 11px; font-weight: 700; color: #ccc; }
        .badge-name.locked { color: #555; }

        /* 4. 설정 리스트 */
        .settings-list { display: flex; flex-direction: column; gap: 2px; background-color: #1A1A1A; border-radius: 16px; overflow: hidden; border: 1px solid #333; }
        .setting-item {
            padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background-color: #1A1A1A; cursor: pointer;
        }
        .setting-item:not(:last-child) { border-bottom: 1px solid #222; }
        .setting-label { font-size: 14px; font-weight: 600; color: #ddd; }
        .setting-arrow { font-size: 12px; color: #666; }

        /* 하단 네비게이션 바 (프로필 탭 활성화) */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 85px;
            background-color: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px);
            border-top: 1px solid #222222; display: flex; justify-content: space-around; align-items: center; padding-bottom: 15px; box-sizing: border-box; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #666666; cursor: pointer; }
        .nav-item.active { color: #CCFF00; }
        .nav-icon { font-size: 24px; }
        .nav-text { font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="bg-pattern"></div>
        
        <div class="header">
            <div class="header-title">PROFILE</div>
            <div class="icon-btn">⚙️</div>
        </div>

        <div class="scroll-section">
            
            <div class="profile-card">
                <div class="avatar">🏃‍♂️</div>
                <div class="nickname">지독한러너</div>
                <div class="tier-badge">🏆 GOLD TIER</div>
                
                <div class="point-box">
                    <span>⚡️ 추월 포인트</span>
                    <span class="point-val">1,450 P</span>
                </div>
            </div>

            <div class="shop-section">
                <div class="section-title"><span>🛒</span> 아이템 상점</div>
                <div class="item-card">
                    <div class="item-info">
                        <div class="item-icon">🧊</div>
                        <div class="item-text">
                            <div class="item-name">스트릭 방어권 (얼음)</div>
                            <div class="item-desc">하루를 쉬어도 불꽃이<br>꺼지지 않게 보호합니다.</div>
                        </div>
                    </div>
                    <div class="btn-buy">
                        <span class="buy-txt">구매하기</span>
                        <span class="buy-price">500 P</span>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title"><span>🎖️</span> 획득한 훈장</div>
                <div class="badges-grid">
                    <div class="badge-item">
                        <div class="badge-icon">👟</div>
                        <div class="badge-name">첫 추월 성공</div>
                    </div>
                    <div class="badge-item">
                        <div class="badge-icon">🔥</div>
                        <div class="badge-name">30일 연속</div>
                    </div>
                    <div class="badge-item">
                        <div class="badge-icon">👑</div>
                        <div class="badge-name">골드 달성</div>
                    </div>
                    <div class="badge-item">
                        <div class="badge-icon locked">🚀</div>
                        <div class="badge-name locked">마라톤 완주</div>
                    </div>
                    <div class="badge-item">
                        <div class="badge-icon locked">💎</div>
                        <div class="badge-name locked">다이아 승급</div>
                    </div>
                    <div class="badge-item">
                        <div class="badge-icon locked">👻</div>
                        <div class="badge-name locked">10명 추월</div>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">설정</div>
                <div class="settings-list">
                    <div class="setting-item">
                        <span class="setting-label">계정 관리</span>
                        <span class="setting-arrow">▶</span>
                    </div>
                    <div class="setting-item">
                        <span class="setting-label">푸시 알림 설정</span>
                        <span class="setting-arrow">▶</span>
                    </div>
                    <div class="setting-item">
                        <span class="setting-label">스마트워치 / 건강 앱 연동</span>
                        <span class="setting-arrow">▶</span>
                    </div>
                    <div class="setting-item">
                        <span class="setting-label">공지사항 및 고객센터</span>
                        <span class="setting-arrow">▶</span>
                    </div>
                </div>
            </div>

        </div>

        <div class="bottom-nav">
            <div class="nav-item">
                <div class="nav-icon">🏠</div>
                <span class="nav-text">홈</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">🏆</div>
                <span class="nav-text">랭킹</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">📅</div>
                <span class="nav-text">기록</span>
            </div>
            <div class="nav-item active">
                <div class="nav-icon">👤</div>
                <span class="nav-text">프로필</span>
            </div>
        </div>

    </div>
</body>
</html>
