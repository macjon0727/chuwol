<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUWOL Insta Share Preview</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        body {
            margin: 0; padding: 0; background-color: #000000; color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 393px; height: 852px;
            background: #0A0A0A;
            position: relative; display: flex; flex-direction: column; box-sizing: border-box;
        }

        /* 상단 헤더 */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 50px 24px 20px 24px; z-index: 10;
        }
        .header-title { font-size: 16px; font-weight: 700; color: #fff; }
        .icon-btn { font-size: 24px; cursor: pointer; color: #fff; }

        /* 공유 카드 미리보기 영역 (가운데 정렬) */
        .preview-section {
            flex-grow: 1; display: flex; justify-content: center; align-items: center;
            padding: 0 24px;
        }

        /* 실제 인스타 스토리에 공유될 9:16 비율의 카드 */
        .export-card {
            width: 280px; height: 498px; /* 9:16 비율 축소판 */
            border-radius: 24px; position: relative; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
        }

        /* 카드 배경 이미지 (러닝 사진) */
        .card-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1552674605-db6ffd4facb5?q=80&w=800&auto=format&fit=crop');
            background-size: cover; background-position: center;
        }

        /* 사진을 살짝 덮는 그라데이션 (텍스트 가독성 확보) */
        .card-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.9) 100%);
        }

        /* 카드 내 콘텐츠 패키지 */
        .card-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; padding: 24px; box-sizing: border-box;
        }

        /* 로고 워터마크 */
        .card-brand {
            font-size: 20px; font-weight: 900; font-style: italic; color: #CCFF00; letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* 하단 기록 정보 배치 */
        .card-bottom {
            margin-top: auto; display: flex; flex-direction: column; gap: 15px;
        }

        /* 추월 배지 (스티커 느낌) */
        .badge-sticker {
            align-self: flex-start;
            background: rgba(204, 255, 0, 0.9); color: #000;
            padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 900;
            display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transform: rotate(-3deg); /* 살짝 비뚤어지게 힙한 느낌 */
        }

        /* 메인 거리 */
        .card-dist {
            font-size: 72px; font-weight: 900; font-style: italic; color: #fff; line-height: 0.9;
            letter-spacing: -3px; text-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .card-dist span { font-size: 24px; font-weight: 700; color: #CCFF00; letter-spacing: 0; }

        /* 서브 통계 */
        .card-stats {
            display: flex; gap: 20px;
        }
        .stat-item { display: flex; flex-direction: column; }
        .stat-val { font-size: 20px; font-weight: 800; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .stat-lbl { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.7); text-transform: uppercase; }

        /* 하단 꾸미기 툴바 & 공유 버튼 */
        .tools-section {
            padding: 20px 24px 40px 24px; display: flex; flex-direction: column; gap: 20px;
        }
        
        /* 테마 선택 (사진 vs 지도) */
        .theme-selector {
            display: flex; gap: 10px; justify-content: center;
        }
        .theme-btn {
            padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer;
            border: 1px solid #333; background: #1A1A1A; color: #888; transition: 0.2s;
        }
        .theme-btn.active {
            background: #CCFF00; color: #000; border-color: #CCFF00;
        }

        /* 공유 액션 버튼 */
        .btn-share {
            width: 100%; height: 60px; border-radius: 16px; background: linear-gradient(90deg, #F58529, #DD2A7B, #8134AF);
            color: #fff; display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: 800;
            cursor: pointer; border: none; gap: 8px;
        }
        .btn-download {
            width: 100%; height: 60px; border-radius: 16px; background: #1A1A1A; border: 1px solid #333;
            color: #fff; display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: 700;
            cursor: pointer; gap: 8px; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <div class="header">
            <div class="icon-btn">✕</div>
            <div class="header-title">스토리 공유</div>
            <div style="width: 24px;"></div> </div>

        <div class="preview-section">
            <div class="export-card">
                <div class="card-bg"></div>
                <div class="card-overlay"></div>
                
                <div class="card-content">
                    <div style="display:flex; justify-content:flex-end;">
                        <div class="card-brand">CHUWOL</div>
                    </div>
                    
                    <div class="card-bottom">
                        <div class="badge-sticker">
                            <span>🔥</span> 43일째 민수 추월!
                        </div>
                        
                        <div class="card-dist">
                            3.24 <span>KM</span>
                        </div>
                        
                        <div class="card-stats">
                            <div class="stat-item">
                                <div class="stat-val">5'28"</div>
                                <div class="stat-lbl">PACE</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-val">17:42</div>
                                <div class="stat-lbl">TIME</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tools-section">
            <div class="theme-selector">
                <div class="theme-btn active">📸 내 사진</div>
                <div class="theme-btn">🗺️ 경로 지도</div>
                <div class="theme-btn">⬛️ 다크 심플</div>
            </div>
            
            <div>
                <button class="btn-share">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    Instagram 스토리 공유
                </button>
                <button class="btn-download">
                    📥 기기에 이미지 저장
                </button>
            </div>
        </div>

    </div>
</body>
</html>
