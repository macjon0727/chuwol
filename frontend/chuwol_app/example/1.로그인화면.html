<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUWOL Login - Original Wide Pattern</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            margin: 0; padding: 0; background-color: #000000; color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 393px; height: 852px; /* iPhone 15/16/17 Pro 사이즈 */
            background: linear-gradient(180deg, #000000 0%, #1A1A1A 100%);
            position: relative; display: flex; flex-direction: column; padding: 60px 30px; box-sizing: border-box;
        }

        /* [요청하신 원본 배경 복구] 넓고 시원한 45도 사선 패턴 */
        .bg-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.1;
            background: repeating-linear-gradient(
                45deg,
                #ffffff,
                #ffffff 1px,
                transparent 1px,
                transparent 40px
            );
            pointer-events: none;
        }

        /* 중앙 정렬된 로고 섹션 */
        .logo-section { 
            margin-top: 110px; flex-grow: 1; 
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }

        .logo-main {
            font-size: 72px; font-weight: 900; font-style: italic; letter-spacing: -4px;
            color: #CCFF00; margin-bottom: 8px; text-transform: uppercase;
        }

        .sub-title { font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; opacity: 0.9; }
        .highlight-text { color: #CCFF00; }

        /* 캐릭터 이모지 공간 */
        .character-box {
            margin-top: 40px; font-size: 70px;
            filter: drop-shadow(0 0 15px rgba(204, 255, 0, 0.4));
            animation: float 2s ease-in-out infinite; 
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .login-section { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }

        /* 버튼 스타일 */
        .btn {
            height: 60px; border-radius: 16px; display: flex; justify-content: center; align-items: center;
            font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none;
            transition: 0.2s;
        }
        
        .btn-icon { width: 24px; height: 24px; margin-right: 12px; }

        .btn-kakao { background-color: #FEE500; color: #000000; }
        .btn-apple { background-color: #ffffff; color: #000000; }

        /* 테두리 있는 둘러보기 버튼 */
        .btn-guest {
            background-color: transparent; color: #888888; border: 1px solid #333333; margin-top: 10px;
        }

        .footer-info { text-align: center; font-size: 12px; color: #555555; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="bg-pattern"></div>
        
        <div class="logo-section">
            <div class="logo-main">CHUWOL</div>
            <div class="sub-title">멈추지 않는 자가 <span class="highlight-text">결국 앞선다</span></div>
            
            <div class="character-box">
                🏃‍♂️💨
            </div>
        </div>

        <div class="login-section">
            <div class="btn btn-kakao">
                <img src="https://developers.kakao.com/assets/img/about/logos/kakaolink_btn_small.png" class="btn-icon">
                카카오로 3초만에 시작
            </div>

            <div class="btn btn-apple">
                <img src="https://images.squarespace-cdn.com/content/v1/5e9fb82b8b9588647c0b60d4/1589146522339-N5N1O1Q2Z1Z01Q0Z3J4E/apple+logo+icon.png" class="btn-icon">
                Apple로 로그인
            </div>

            <div class="btn btn-guest">
                둘러보기
            </div>
        </div>

        <div class="footer-info">
            지금 12,402명이 서로를 추월하고 있습니다.
        </div>
    </div>
</body>
</html>
