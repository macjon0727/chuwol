<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUWOL Evolving Profile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        body {
            margin: 0; padding: 0; background-color: #000000; color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 393px; height: 852px;
            background: linear-gradient(180deg, #0A0A0A 0%, #111111 100%);
            position: relative; display: flex; flex-direction: column; box-sizing: border-box;
        }

        .bg-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.15;
            background-image: repeating-linear-gradient(-45deg, #444444, #444444 1px, transparent 1px, transparent 8px);
            pointer-events: none;
        }

        .header {
            padding: 60px 24px 20px 24px; position: relative; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-title { font-size: 20px; font-weight: 900; font-style: italic; letter-spacing: 1px; color: #fff; }

        .scroll-section {
            flex-grow: 1; overflow-y: auto; padding: 0 24px 100px 24px; position: relative; z-index: 10;
            display: flex; flex-direction: column; gap: 30px;
        }

        /* [핵심 수정] 캐릭터 성장 센터 */
        .growth-card {
            background-color: #1A1A1A; border: 1px solid #333; border-radius: 24px; padding: 30px 20px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 진화 단계 라벨 */
        .evolution-stage {
            font-size: 11px; font-weight: 900; color: #CCFF00; background: rgba(204, 255, 0, 0.1);
            padding: 4px 12px; border-radius: 20px; margin-bottom: 20px; text-transform: uppercase;
        }

        /* 캐릭터 아우라 효과 */
        .avatar-container {
            position: relative; width: 120px; height: 120px; margin-bottom: 20px;
        }
        .aura {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; background: radial-gradient(circle, rgba(204, 255, 0, 0.2) 0%, transparent 70%);
            animation: pulse-aura 2s infinite;
        }
        @keyframes pulse-aura {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        .main-avatar {
            position: relative; z-index: 2; width: 100%; height: 100%;
            background-color: #222; border-radius: 50%; border: 3px solid #CCFF00;
            display: flex; justify-content: center; align-items: center; font-size: 50px;
            box-shadow: 0 0 30px rgba(204, 255, 0, 0.3);
        }

        .user-name { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 5px; }
        
        /* 성장 게이지 바 */
        .growth-gauge-container { width: 100%; margin-top: 15px; }
        .gauge-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: #888; margin-bottom: 6px; }
        .gauge-bar { width: 100%; height: 8px; background: #333; border-radius: 4px; position: relative; overflow: hidden; }
        .gauge-fill { width: 75%; height: 100%; background: #CCFF00; border-radius: 4px; box-shadow: 0 0 10px #CCFF00; }
        .next-hint { font-size: 12px; color: #CCFF00; margin-top: 10px; font-weight: 600; }

        /* 포인트 및 기록 요약 */
        .quick-stats { display: flex; width: 100%; gap: 10px; margin-top: 25px; }
        .q-stat { flex: 1; background: #000; padding: 12px; border-radius: 12px; border: 1px solid #222; }
        .q-val { display: block; font-size: 16px; font-weight: 900; color: #fff; font-style: italic; }
        .q-lbl { font-size: 10px; color: #666; font-weight: 700; text-transform: uppercase; }

        .section-title { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        /* 상점 아이템 카드 */
        .item-card {
            background: #1A1A1A; border: 1px solid rgba(204, 255, 0, 0.3); border-radius: 20px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .item-info { display: flex; align-items: center; gap: 15px; }
        .item-icon { font-size: 36px; }
        .item-name { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 2px; }
        .item-desc { font-size: 11px; color: #888; line-height: 1.3; }
        .btn-buy {
            background: rgba(204, 255, 0, 0.1); border: 1px solid #CCFF00; border-radius: 12px;
            padding: 10px 15px; text-align: center; cursor: pointer;
        }
        .buy-txt { display: block; font-size: 11px; font-weight: 800; color: #CCFF00; }
        .buy-price { font-size: 14px; font-weight: 900; color: #fff; font-style: italic; }

        /* 하단 네비게이션 */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 85px;
            background-color: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px);
            border-top: 1px solid #222222; display: flex; justify-content: space-around; align-items: center; padding-bottom: 15px; box-sizing: border-box; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #666666; }
        .nav-item.active { color: #CCFF00; }
        .nav-icon { font-size: 24px; }
        .nav-text { font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="bg-pattern"></div>
        
        <div class="header">
            <div class="header-title">MY CHUWOL</div>
            <div style="font-size:20px;">⚙️</div>
        </div>

        <div class="scroll-section">
            <div class="growth-card">
                <div class="evolution-stage">Stage 3. 지독한 러너</div>
                
                <div class="avatar-container">
                    <div class="aura"></div>
                    <div class="main-avatar">🏃‍♂️</div>
                </div>

                <div class="user-name">지독한러너</div>
                
                <div class="growth-gauge-container">
                    <div class="gauge-header">
                        <span>성장 에너지</span>
                        <span>75%</span>
                    </div>
                    <div class="gauge-bar">
                        <div class="gauge-fill"></div>
                    </div>
                    <div class="next-hint">🔥 3일 더 추월하면 '네온 스피드스터'로 진화!</div>
                </div>

                <div class="quick-stats">
                    <div class="q-stat">
                        <span class="q-val">1,450</span>
                        <span class="q-lbl">Points</span>
                    </div>
                    <div class="q-stat">
                        <span class="q-val">43일</span>
                        <span class="q-lbl">Streak</span>
                    </div>
                    <div class="q-stat">
                        <span class="q-val">Gold II</span>
                        <span class="q-lbl">Tier</span>
                    </div>
                </div>
            </div>

            <div class="shop-section">
                <div class="section-title"><span>🛒</span> 아이템 상점</div>
                <div class="item-card">
                    <div class="item-info">
                        <div class="item-icon">🧊</div>
                        <div class="item-text">
                            <div class="item-name">스트릭 방어권</div>
                            <div class="item-desc">캐릭터가 퇴화하지 않도록<br>하루를 보호합니다.</div>
                        </div>
                    </div>
                    <div class="btn-buy">
                        <span class="buy-txt">구매하기</span>
                        <span class="buy-price">500 P</span>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title"><span>🎖️</span> 최근 획득 배지</div>
                <div style="display: flex; gap: 10px;">
                    <div style="flex:1; background:#1A1A1A; padding:15px; border-radius:15px; text-align:center;">
                        <span style="font-size:30px;">👟</span>
                        <div style="font-size:10px; margin-top:5px; color:#888;">첫 추월</div>
                    </div>
                    <div style="flex:1; background:#1A1A1A; padding:15px; border-radius:15px; text-align:center;">
                        <span style="font-size:30px;">🔥</span>
                        <div style="font-size:10px; margin-top:5px; color:#888;">지독한 30일</div>
                    </div>
                    <div style="flex:1; background:#1A1A1A; padding:15px; border-radius:15px; text-align:center;">
                        <span style="font-size:30px;">👑</span>
                        <div style="font-size:10px; margin-top:5px; color:#888;">골드 입성</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item">
                <div class="nav-icon">🏠</div>
                <span class="nav-text">홈</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">🏆</div>
                <span class="nav-text">랭킹</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">📅</div>
                <span class="nav-text">기록</span>
            </div>
            <div class="nav-item active">
                <div class="nav-icon">👤</div>
                <span class="nav-text">프로필</span>
            </div>
        </div>
    </div>
</body>
</html>
