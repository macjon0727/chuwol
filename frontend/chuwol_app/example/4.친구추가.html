<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUWOL Add Friends</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        body {
            margin: 0; padding: 0; background-color: #000000; color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 393px; height: 852px;
            background: linear-gradient(180deg, #0A0A0A 0%, #111111 100%);
            position: relative; display: flex; flex-direction: column; box-sizing: border-box;
        }

        /* 미세한 왼쪽 사선 패턴 */
        .bg-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.15;
            background-image: repeating-linear-gradient(-45deg, #444444, #444444 1px, transparent 1px, transparent 8px);
            pointer-events: none;
        }

        /* 상단 헤더 */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 60px 24px 20px 24px; position: relative; z-index: 10;
        }
        .header-title { font-size: 18px; font-weight: 700; }
        .icon-btn { font-size: 24px; cursor: pointer; }

        /* 메인 컨텐츠 영역 (스크롤 가능) */
        .content-section {
            padding: 0 24px; flex-grow: 1; overflow-y: auto; position: relative; z-index: 10;
            display: flex; flex-direction: column; gap: 30px; padding-bottom: 40px;
        }

        /* 1. 검색바 & QR 스캔 */
        .search-container {
            display: flex; gap: 10px; align-items: center;
        }
        .search-box {
            flex-grow: 1; height: 48px; background-color: #1A1A1A; border: 1px solid #333;
            border-radius: 12px; padding: 0 16px; display: flex; align-items: center; gap: 10px;
        }
        .search-input {
            background: transparent; border: none; color: #fff; font-size: 15px; width: 100%; outline: none; font-family: 'Inter', sans-serif;
        }
        .search-input::placeholder { color: #666; }
        .qr-btn {
            width: 48px; height: 48px; background-color: rgba(204, 255, 0, 0.1); border: 1px solid #CCFF00;
            border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; color: #CCFF00;
        }

        /* 2. 카카오톡 & 연락처 연동 배너 */
        .invite-banners {
            display: flex; flex-direction: column; gap: 12px;
        }
        .banner-kakao {
            background-color: #FEE500; border-radius: 16px; padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .banner-kakao .b-text { color: #000; font-weight: 800; font-size: 15px; }
        .banner-kakao .b-sub { color: rgba(0,0,0,0.6); font-weight: 600; font-size: 12px; margin-top: 2px; }
        
        .banner-contacts {
            background-color: #1A1A1A; border: 1px solid #333; border-radius: 16px; padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .banner-contacts .b-text { color: #fff; font-weight: 700; font-size: 15px; }
        .banner-contacts .b-sub { color: #888; font-weight: 600; font-size: 12px; margin-top: 2px; }

        /* 섹션 제목 */
        .section-title {
            font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
        }
        .section-title span { color: #CCFF00; font-weight: 900; }

        /* 3. 유저 리스트 (추천 타겟) */
        .user-list {
            display: flex; flex-direction: column; gap: 12px;
        }
        .user-card {
            display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #222;
        }
        .user-avatar {
            width: 44px; height: 44px; border-radius: 50%; background-color: #222; border: 1px solid #444;
            display: flex; justify-content: center; align-items: center; font-size: 20px; margin-right: 12px;
        }
        .user-info { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .user-name { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
        .tier-badge { font-size: 10px; background: rgba(255, 215, 0, 0.2); color: #FFD700; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
        .user-stat { font-size: 12px; font-weight: 600; color: #888; }
        
        /* 타겟 지목 버튼 */
        .btn-add {
            padding: 8px 16px; border-radius: 20px; background-color: rgba(204, 255, 0, 0.1); border: 1px solid #CCFF00;
            color: #CCFF00; font-size: 13px; font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .btn-add:active { background-color: #CCFF00; color: #000; }

    </style>
</head>
<body>
    <div class="app-container">
        <div class="bg-pattern"></div>
        
        <div class="header">
            <div class="icon-btn">🔙</div>
            <div class="header-title">타겟 찾기</div>
            <div style="width: 24px;"></div> </div>

        <div class="content-section">
            
            <div class="search-container">
                <div class="search-box">
                    <span style="color:#666;">🔍</span>
                    <input type="text" class="search-input" placeholder="닉네임으로 타겟 검색">
                </div>
                <div class="qr-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                </div>
            </div>

            <div class="invite-banners">
                <div class="banner-kakao">
                    <div>
                        <div class="b-text">카카오톡으로 도발장 보내기</div>
                        <div class="b-sub">친구를 초대하고 함께 랭킹전을 즐기세요.</div>
                    </div>
                    <span style="font-size:20px; color:#000;">💬</span>
                </div>
                
                <div class="banner-contacts">
                    <div>
                        <div class="b-text">내 연락처에서 타겟 찾기</div>
                        <div class="b-sub">전화번호부에 있는 러너들을 확인합니다.</div>
                    </div>
                    <span style="font-size:20px;">📱</span>
                </div>
            </div>

            <div>
                <div class="section-title"><span>🔥</span> 나랑 비슷한 레벨의 타겟 추천</div>
                
                <div class="user-list">
                    <div class="user-card">
                        <div class="user-avatar">🦊</div>
                        <div class="user-info">
                            <div class="user-name">달리는여우 <span class="tier-badge">GOLD</span></div>
                            <div class="user-stat">평균 5'30" 페이스 | 🔥 12일</div>
                        </div>
                        <button class="btn-add">타겟 지목</button>
                    </div>

                    <div class="user-card">
                        <div class="user-avatar">😎</div>
                        <div class="user-info">
                            <div class="user-name">초보러너탈출 <span class="tier-badge">GOLD</span></div>
                            <div class="user-stat">평균 5'45" 페이스 | 🔥 4일</div>
                        </div>
                        <button class="btn-add">타겟 지목</button>
                    </div>

                    <div class="user-card">
                        <div class="user-avatar">👻</div>
                        <div class="user-info">
                            <div class="user-name">야간순찰대 <span class="tier-badge">SILVER</span></div>
                            <div class="user-stat">평균 6'00" 페이스 | 🔥 42일</div>
                        </div>
                        <button class="btn-add">타겟 지목</button>
                    </div>
                </div>
            </div>

        </div>

    </div>
</body>
</html>
