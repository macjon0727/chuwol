<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUWOL Permissions Sync</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        body {
            margin: 0; padding: 0; background-color: #000000; color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 393px; height: 852px;
            background: linear-gradient(180deg, #0A0A0A 0%, #111111 100%);
            position: relative; display: flex; flex-direction: column; box-sizing: border-box;
        }

        /* 배경 패턴 */
        .bg-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.15;
            background-image: repeating-linear-gradient(-45deg, #444444, #444444 1px, transparent 1px, transparent 8px);
            pointer-events: none;
        }

        /* 상단 건너뛰기 버튼 */
        .top-nav {
            padding: 50px 24px 10px 24px; display: flex; justify-content: flex-end; position: relative; z-index: 10;
        }
        .btn-skip { font-size: 14px; color: #666; font-weight: 600; cursor: pointer; text-decoration: underline; }

        /* 헤더 (애니메이션 아이콘 포함) */
        .header-section {
            padding: 20px 24px 40px 24px; text-align: center; position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center;
        }
        
        /* 연결 대기중인 레이더/스마트폰 아이콘 효과 */
        .sync-icon-wrapper {
            width: 80px; height: 80px; border-radius: 50%; background: rgba(204, 255, 0, 0.1); border: 2px solid rgba(204, 255, 0, 0.3);
            display: flex; justify-content: center; align-items: center; font-size: 32px; margin-bottom: 20px;
            position: relative;
        }
        .sync-pulse {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
            border: 2px solid #CCFF00; animation: pulse 2s infinite; box-sizing: border-box;
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }

        .header-title { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: -1px; line-height: 1.3; margin-bottom: 10px; }
        .header-title span { color: #CCFF00; font-style: italic; }
        .header-sub { font-size: 14px; color: #888; font-weight: 600; line-height: 1.5; }

        /* 권한 리스트 카드 */
        .permissions-list {
            padding: 0 24px; flex-grow: 1; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 10;
        }
        
        .perm-card {
            background-color: #1A1A1A; border: 1px solid #333; border-radius: 16px; padding: 20px;
            display: flex; align-items: center; gap: 16px; transition: 0.2s;
        }
        .perm-icon {
            width: 44px; height: 44px; border-radius: 50%; background-color: #222;
            display: flex; justify-content: center; align-items: center; font-size: 20px; flex-shrink: 0;
        }
        .perm-info { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .perm-title { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
        .badge-req { font-size: 10px; background: rgba(255, 68, 68, 0.2); color: #FF4444; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
        .badge-opt { font-size: 10px; background: rgba(204, 255, 0, 0.2); color: #CCFF00; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
        .perm-desc { font-size: 12px; font-weight: 600; color: #888; line-height: 1.4; }

        /* 커스텀 토글 스위치 (iOS 스타일) */
        .toggle-switch {
            width: 44px; height: 24px; background-color: #333; border-radius: 12px; position: relative; cursor: pointer; flex-shrink: 0; transition: 0.3s;
        }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
            background-color: #fff; border-radius: 50%; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        /* 토글 켜진 상태 (.active) */
        .toggle-switch.active { background-color: #CCFF00; }
        .toggle-switch.active::after { left: calc(100% - 2px); transform: translateX(-100%); }

        /* 하단 액션 버튼 */
        .action-section {
            padding: 20px 24px 40px 24px; position: relative; z-index: 10;
        }
        .btn-submit {
            width: 100%; height: 64px; border-radius: 16px; background-color: #CCFF00; color: #000;
            display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: 900;
            cursor: pointer; border: none; box-shadow: 0 8px 20px rgba(204, 255, 0, 0.4); transition: 0.2s; gap: 8px;
        }
        .btn-submit:active { transform: translateY(2px); box-shadow: 0 4px 10px rgba(204, 255, 0, 0.4); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="bg-pattern"></div>
        
        <div class="top-nav">
            <div class="btn-skip">나중에 하기</div>
        </div>

        <div class="header-section">
            <div class="sync-icon-wrapper">
                <div class="sync-pulse"></div>
                ⌚️
            </div>
            <div class="header-title">정확한 <span>추월</span>을 위해<br>연결이 필요해요</div>
            <div class="header-sub">친구들과 공정한 승부를 겨루기 위해<br>아래의 권한들을 허용해 주세요.</div>
        </div>

        <div class="permissions-list">
            
            <div class="perm-card" style="border-color: rgba(204, 255, 0, 0.3); background-color: rgba(204, 255, 0, 0.05);">
                <div class="perm-icon" style="color: #CCFF00;">📍</div>
                <div class="perm-info">
                    <div class="perm-title">위치 (GPS) <span class="badge-req">필수</span></div>
                    <div class="perm-desc">내가 뛴 거리와 페이스를 정확하게 측정하고 지도를 그립니다.</div>
                </div>
                <div class="toggle-switch active"></div> </div>

            <div class="perm-card">
                <div class="perm-icon">❤️</div>
                <div class="perm-info">
                    <div class="perm-title">건강 데이터 연동 <span class="badge-req">필수</span></div>
                    <div class="perm-desc">애플워치, 갤럭시워치의 활동 기록과 심박수를 CHUWOL로 가져옵니다.</div>
                </div>
                <div class="toggle-switch active"></div>
            </div>

            <div class="perm-card">
                <div class="perm-icon">🔔</div>
                <div class="perm-info">
                    <div class="perm-title">푸시 알림 <span class="badge-opt">선택</span></div>
                    <div class="perm-desc">친구가 내 기록을 추월했을 때, 실시간으로 알림을 받아 방어하세요!</div>
                </div>
                <div class="toggle-switch"></div> 
            </div>

        </div>

        <div class="action-section">
            <button class="btn-submit">
                모두 허용하고 시작하기 🚀
            </button>
        </div>

    </div>
</body>
</html>
